schema_version: 1
policy_id: P10_TFDU_RUNTIME_REST_2026_08_08
status: ACTIVE
effective_date_local: "2026-08-08"
source: "Direct user instruction in the current Codex task"
source_statement: "任何一个小板都不能连续运行超过30分钟，每个环节运行结束后需要至少休息一半运行时间再启动发射"
scope: "All subsequent P10 hardware stages using any installed TFDU small board"
maximum_continuous_runtime_seconds: 1800
cooldown_ratio_numerator: 1
cooldown_ratio_denominator: 2
runtime_boundary:
  start: "Immediately before a TX-capable functional stage is invoked"
  end: "After the stage has ended and dual-board shutdown-after is verified"
cooldown_boundary:
  start: "Only after verified dual-board shutdown-after"
  end: "Immediately before any later TX-capable stage may start"
rounding: "Required cooldown is rounded up to the next whole millisecond"
module_accounting: "Conservatively charge every installed module on both endpoints for every TX-capable stage"
enforcement:
  planned_runtime_above_limit: FAIL_CLOSED
  measured_runtime_above_limit: FAIL_CLOSED
  missing_shutdown_after: FAIL_CLOSED
  incomplete_cooldown: FAIL_CLOSED
  reset_does_not_count_as_shutdown: true
evidence_fields:
  - stage
  - modules
  - start_utc
  - shutdown_verified_utc
  - measured_runtime_seconds
  - required_cooldown_seconds
  - cooldown_completed_utc
  - actual_cooldown_seconds
  - status
