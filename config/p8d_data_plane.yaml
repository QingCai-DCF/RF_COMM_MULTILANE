schema_version: 1
configuration_id: P8D_DATA_PLANE_V1
protocol_version: RF_COMM_L2
legacy_mode_version: 1
vnext_mode_version: 2

# One sequence space and one bounded window per endpoint/direction.  Per-lane
# queues contain entry references; they do not own independent sequence spaces.
sequence_width_bits: 16
global_outstanding_default: 32
global_outstanding_by_profile:
  Z7010_2LANE_DEV: 32
  Z7020_ROTATING_8LANE_MODEL: 64
  Z7020_FIXED_32MODULE_ACCOUNTING_MODEL_WITH_8LANE_DATA_PLANE: 64
sack_window_bits_by_profile:
  Z7010_2LANE_DEV: 32
  Z7020_ROTATING_8LANE_MODEL: 64
  Z7020_FIXED_32MODULE_ACCOUNTING_MODEL_WITH_8LANE_DATA_PLANE: 64
rx_reorder_window: 64
duplicate_history_depth: 128

max_retry: 7
retry_backoff_policy: bounded_exponential_saturating
rto_initial_cycles: 64000
rto_min_cycles: 32000
rto_max_cycles: 512000
ack_aggregation_frame_threshold: 8
ack_aggregation_max_delay_cycles: 32000
ack_credit_low_watermark: 8
max_ack_payload_bytes: 32

scheduler_type: weighted_deficit_round_robin_bytes
scheduler_weight_width: 8
scheduler_default_weights: [1, 1, 1, 1, 1, 1, 1, 1]
retry_priority_policy: retry_then_normal_with_bounded_burst
retry_priority_burst_max: 8
# A timed-out attempt must use a different safe lane when one exists.  The
# previous lane remains available only in the exact one-eligible-lane fallback.
retry_path_diversity_policy: alternate_last_lane_when_possible
control_priority_policy: strict_with_bounded_burst
control_priority_burst_max: 4
starvation_bound: 4096

axis_data_width_by_profile:
  Z7010_2LANE_DEV: 32
  Z7020_ROTATING_8LANE_MODEL: 64
  Z7020_FIXED_32MODULE_ACCOUNTING_MODEL_WITH_8LANE_DATA_PLANE: 64
axis_user_width: 64
axis_keep_enabled: true
max_frame_bytes: 288
max_l1_payload_bytes: 247
rfap_v1_useful_chunk_bytes: 215

tx_ring_depth: 64
rx_ring_depth: 64
descriptor_bytes: 64
descriptor_alignment_bytes: 64
descriptor_generation_bits: 16
ring_index_bits: 32
payload_buffer_strategy: shared_global_tx_rx_frame_stores
retransmission_storage_strategy: shared_global_entry_indexed_store

session_epoch_width: 32
path_epoch_width: 16
accepted_previous_path_epochs: 1
stream_id_width: 32
object_id_width: 32

descriptor_layout:
  version: 1
  byte_order: little_endian
  fields:
    - {name: version_state_generation, offset: 0, width_bits: 32}
    - {name: flags_priority_lane_policy, offset: 4, width_bits: 32}
    - {name: buffer_address, offset: 8, width_bits: 64}
    - {name: buffer_capacity, offset: 16, width_bits: 32}
    - {name: requested_length, offset: 20, width_bits: 32}
    - {name: actual_length, offset: 24, width_bits: 32}
    - {name: stream_id, offset: 28, width_bits: 32}
    - {name: object_id, offset: 32, width_bits: 32}
    - {name: user_tag, offset: 36, width_bits: 32}
    - {name: session_epoch, offset: 40, width_bits: 32}
    - {name: completion_status, offset: 44, width_bits: 16}
    - {name: error_code, offset: 46, width_bits: 16}
    - {name: next_index, offset: 48, width_bits: 32}
    - {name: reserved0, offset: 52, width_bits: 32}
    - {name: timestamp_or_cookie, offset: 56, width_bits: 64}

airtime_model_parameters:
  phy_raw_bps_per_lane: 4000000
  frame_overhead_bytes: 22
  nominal_txd_high_fraction: 0.25
  ack_frame_payload_bytes: 20
  direction_window_frames: 32
  direction_guard_us: 10.0
  nominal_per: 0.01
  dma_descriptor_gap_us: 0.5
  ps_network_spi_placeholder_overhead_fraction: 0.01
  latency_jitter_us: 25.0
duty_design_target: 0.18
duty_hard_limit: 0.20
handover_service_gap_source:
  evidence_path: evidence/generated/p8b_handover_timing_summary.json
  metric: application_service_gap_us
  nominal_us: 30.0
  fixed_module_pitch_time_at_600rpm_us: 3125.0

rfap_vnext:
  header_bytes: 48
  maximum_bounded_inflight_bytes: 1048576
  minimum_supported_object_bytes: 67108864
  final_length_may_be_unknown: true
  atomic_publish_required: true
  object_crc32_required: true
  endpoint_sha256_required: true
