- requirement_id: P10_3-DEG-001
  requirement_text: The endpoint shall degrade and recover across four, three, two, and one available lane without false commit.
  profile: P10_3_DEGRADED_MODES
  verification_method: Inject live unavailable-lane masks and verify persistent exclusion, progress, recovery, and integrity;
    for each in-flight migration case arm the validation-only PL atomic migration diagnostic with the selected target lane,
    require its first accepted physical DATA attempt to carry a deliberately invalid CRC, and in the same PL clock as that
    serializer-complete event replace target-only internal eligibility with target-unavailable eligibility. Read back the
    frozen trigger sequence, cumulative ACK base, one-to-32-frame outstanding count, attempt count, target physical-TX count,
    target scheduler count, zero prior migrations, trigger count of one, effective unavailable mask, and receiver target-lane
